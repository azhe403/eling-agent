name: pre-release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Base product version; kept in sync with <Version> in Directory.Build.props.
# Each push to main produces a unique pre-release: v0.1.0-pre.{run_number}.
env:
  VERSION: 0.1.0

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 1. Publish Desktop (self-contained — brings the .NET runtime)
      - name: Publish Desktop
        run: >
          dotnet publish src/desktop/Eling.Desktop
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -o publish

      # 2. Publish Backend (self-contained — dashboard UI included, merged into Desktop folder)
      - name: Publish Backend
        run: >
          dotnet publish src/backend/Eling.Backend
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -o publish-backend

      - name: Package backend-only
        shell: bash
        run: |
          find publish-backend -name "*.pdb" -delete
          cd publish-backend
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a "../eling-backend-${{ matrix.rid }}.zip" .
          else
            tar czf "../eling-backend-${{ matrix.rid }}.tar.gz" .
          fi

      - name: Merge into shared folder
        shell: bash
        run: |
          cp publish-backend/eling-backend.* publish/
          for f in publish-backend/*.dll; do
            [ -e "$f" ] || continue
            dest="publish/$(basename "$f")"
            if [ -f "$dest" ]; then
              if ! cmp -s "$f" "$dest"; then echo "ERROR: conflicting $f differs from $dest"; exit 1; fi
            else
              cp "$f" publish/
            fi
          done
          if [ -d publish-backend/eling-dashboard-ui ]; then
            rm -rf publish/eling-dashboard-ui
            cp -r publish-backend/eling-dashboard-ui publish/
          fi
          rm -rf publish-backend

      - name: Package
        shell: bash
        run: |
          find publish -name "*.pdb" -delete
          cd publish
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a "../eling-${{ matrix.rid }}.zip" .
          else
            tar czf "../eling-${{ matrix.rid }}.tar.gz" .
          fi

      - name: Package dashboard UI (single cross-platform asset)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          if [ ! -d publish/eling-dashboard-ui ]; then echo "ERROR: dashboard UI missing in publish output"; exit 1; fi
          cd publish/eling-dashboard-ui
          tar czf "../../eling-dashboard-ui.tar.gz" .
          zip -qr "../../eling-dashboard-ui.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: eling-${{ matrix.rid }}
          path: |
            eling-*.zip
            eling-*.tar.gz

  # Publish a pre-release only on push to main (unique version per build for
  # easy rollback). Pull requests only run the build matrix as validation.
  release:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-ci]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-pre.${{ github.run_number }}
          name: Pre-release v${{ env.VERSION }}-pre.${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
