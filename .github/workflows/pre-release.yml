name: pre-release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Base product version; kept in sync with <Version> in Directory.Build.props.
# Each push to main produces a unique pre-release: v0.1.0-pre.{run_number}.
env:
  VERSION: 0.1.0

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # BuildDashboard target runs pnpm install + build automatically.
      # Both executables publish into the same folder: installed eling
      # locates its paired eling-dashboard next to itself.
      - name: Publish
        run: >
          dotnet publish src/backend/Eling.Host
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Publish dashboard
        run: >
          dotnet publish src/backend/Eling.Dashboard
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Package
        shell: bash
        run: |
          find publish -name "*.pdb" -delete
          cd publish
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a "../eling-${{ matrix.rid }}.zip" .
          else
            tar czf "../eling-${{ matrix.rid }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: eling-${{ matrix.rid }}
          path: eling-${{ matrix.rid }}.*

  # Publish a pre-release only on push to main (unique version per build for
  # easy rollback). Pull requests only run the build matrix as validation.
  release:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip-ci]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-pre.${{ github.run_number }}
          name: Pre-release v${{ env.VERSION }}-pre.${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
