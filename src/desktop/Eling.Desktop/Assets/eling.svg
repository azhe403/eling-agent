<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </linearGradient>

    <!-- E Glyph Gradient -->
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Middle Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGlow)" />
  <rect x="33" y="33" width="446" height="446" rx="103" ry="103" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Subtle Ambient Core Glow behind E -->
  <circle cx="240" cy="256" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)" />

  <!-- Stylized 'E' Group with Shadow & Glow -->
  <g filter="url(#softShadow)">
    <!-- Vertical Spine -->
    <rect x="120" y="128" width="56" height="256" rx="28" ry="28" fill="url(#eGrad)" />

    <!-- Top Bar with tapered flow -->
    <rect x="120" y="128" width="204" height="56" rx="28" ry="28" fill="url(#eGrad)" />

    <!-- Middle Bar (Active Memory Synapse) -->
    <rect x="120" y="228" width="168" height="56" rx="28" ry="28" fill="url(#pulseGrad)" />
    <!-- Node indicator inside middle bar -->
    <circle cx="260" cy="256" r="14" fill="#e0f2fe" opacity="0.9" />
    <circle cx="260" cy="256" r="6" fill="#0284c7" />

    <!-- Bottom Bar -->
    <rect x="120" y="328" width="224" height="56" rx="28" ry="28" fill="url(#eGrad)" />
  </g>

  <!-- Memory Spark (4-Point Diamond Star at Top-Right) -->
  <g transform="translate(364, 156)">
    <!-- Outer radial glow aura -->
    <circle cx="0" cy="0" r="48" fill="url(#sparkGlow)" opacity="0.85" />
    <!-- 4-point star path -->
    <path d="M 0,-32 Q 0,0 32,0 Q 0,0 0,32 Q 0,0 -32,0 Q 0,0 0,-32 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
  </g>
</svg>